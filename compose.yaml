services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: typixel
      POSTGRES_USER: typixel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "typixel", "-d", "typixel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
